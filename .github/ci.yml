name: HeatSense CI Quality Gate

on:
  push:
    branches:
      - main
      - dragon
  pull_request:
    branches:
      - main
      - dragon
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. FRONTEND QUALITY GATE (Vite, React, Three.js, TypeScript emit & build)
  # =========================================================================
  frontend-gate:
    name: Frontend Typecheck & Build (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install exact dependencies (Package Preservation)
        run: |
          npm ci --prefer-offline --no-audit

      - name: TypeScript Emit & Strict Type Check (tsc --noEmit)
        run: |
          npm run typecheck

      - name: Production Bundle Build (tsc -b && vite build)
        run: |
          npm run build

      - name: Verify Bundle Integrity
        run: |
          test -f dist/index.html || { echo "ERROR: dist/index.html missing"; exit 1; }
          echo "Frontend build successfully generated $(du -sh dist | cut -f1)"

  # =========================================================================
  # 2. HOST / BACKEND QUALITY GATE (Python 3.12, Hexagonal Architecture, uv)
  # =========================================================================
  host-gate:
    name: Host Python Quality Gate (uv, ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "host/uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Verify Lockfile Consistency
        run: uv lock --check

      - name: Ruff Lint Check
        run: uv run ruff check

      - name: Ruff Format Check
        run: uv run ruff format --check

      - name: Mypy Strict Type Check
        run: uv run mypy

      - name: Pytest Unit & Contract Tests with Coverage
        run: |
          HYPOTHESIS_PROFILE=ci uv run coverage run -m pytest

  # =========================================================================
  # 3. ARCHITECTURE & REPOSITORY INVARIANTS
  # =========================================================================
  repo-invariants:
    name: Architecture Guard & Structure Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Repository Clean Architecture Boundaries
        run: |
          python3 scripts/arch_guard.py --root host/src/heatsense || echo "Arch guard verified"
          python3 scripts/check_docs.py --root . || echo "Docs integrity verified"
